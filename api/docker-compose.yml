version: '3.8'

services:
  # 1. Database Service (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce_network
    restart: always

  # 2. Cache Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_network
    restart: always

  # 3. API Service (NestJS)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_api
    ports:
      - '8080:8080'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}
      REDIS_URL: redis://redis:6379
      PORT: 8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-supersecretaccess}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecretrefresh}
      JWT_ACCESS_EXPIRED: ${JWT_ACCESS_EXPIRED:-15m}
      JWT_REFRESH_EXPIRED: ${JWT_REFRESH_EXPIRED:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    command: /bin/sh -c "npx prisma db push && npm run start:prod"
    depends_on:
      - postgres
      - redis
    networks:
      - ecommerce_network
    restart: always

volumes:
  postgres_data:
  redis_data:

networks:
  ecommerce_network:
    driver: bridge
