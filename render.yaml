# =====================================================================
# RENDER BLUEPRINT - FULLSTACK DEPLOYMENT
# =====================================================================
# This file automates deployment to Render.com.
# 1. Create a dynamic Blueprint on Render.
# 2. Connect your GitHub repository.
# 3. Render will provision all resources.
# =====================================================================

databases:
  - name: db
    databaseName: ecommerce
    user: ecommerce_db
    plan: free

services:
  # 1. Redis Service (Internal)
  - type: redis
    name: redis
    ipAllowList: []
    plan: free

  # 2. API Service (NestJS)
  - type: web
    name: api
    env: node
    plan: free
    # rootDir: api  <-- Removed to fix ENOENT
    buildCommand: cd api && npm install && npx prisma generate && npm run build
    startCommand: cd api && npx prisma db push && node dist/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://web.onrender.com # Placeholder - Update after web deploy

  # 3. Web Service (Next.js)
  - type: web
    name: web
    env: node
    plan: free
    # rootDir: web <-- Removed to fix ENOENT
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_URL
        value: http://api:10000/api/v1
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set this in Render dashboard after API service is live
        placeholder: "https://api.onrender.com/api/v1"
