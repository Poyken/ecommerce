# =====================================================================
# RENDER BLUEPRINT - FULLSTACK DEPLOYMENT
# =====================================================================
# File này dùng để deploy tự động lên Render.com
# Lưu ý: Yêu cầu tài khoản Render (Free tier có giới hạn Redis/Postgres)
# =====================================================================

databases:
  - name: ecommerce-db
    databaseName: ecommerce
    user: postgres
    plan: free # Có thể đổi thành 'standard' cho production

services:
  # 1. Redis Service
  - type: redis
    name: ecommerce-redis
    ipAllowList: [] # Chỉ cho phép nội bộ Render gọi
    plan: free

  # 2. API Service (NestJS)
  - type: web
    name: ecommerce-api
    env: node
    rootDir: api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/src/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # 3. Web Service (Next.js)
  - type: web
    name: ecommerce-web
    env: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          type: web
          name: ecommerce-api
          property: host
      - key: NEXT_PUBLIC_API_URL
        value: https://ecommerce-api.onrender.com/api/v1 # Đổi thành domain thật của bạn sau khi deploy API
