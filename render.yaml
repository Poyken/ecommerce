# =====================================================================
# RENDER BLUEPRINT - FULLSTACK DEPLOYMENT
# =====================================================================
# Giải thích cho thực tập sinh:
# File này (Blueprint) dùng để tự động hóa việc triển khai (deployment) lên Render.com.
# Nó định nghĩa cách các service (API, Web, DB, Redis) kết nối với nhau trên hạ tầng cloud.
# =====================================================================

databases:
  - name: db
    databaseName: ecommerce
    user: ecommerce_db
    plan: free

services:
  # 1. Redis Service (Internal)
  - type: redis
    name: redis
    ipAllowList: []
    plan: free

  # 2. API Service (NestJS)
  - type: web
    name: api
    env: node
    plan: starter # Changed from free to support scaling
    numReplicas: 2 # [OPTIMIZATION] Zero-Downtime Deployment
    healthCheckPath: /api/v1/health
    buildCommand: ls -R && cd api && npm install && npx prisma generate && npm run build && npm run build:seeds
    startCommand: cd api && npx prisma db push && npm run seed:all:prod && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION # Force install devDependencies for build
        value: false
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://web.onrender.com # Placeholder - Update after web deploy

  # 3. Web Service (Next.js)
  - type: web
    name: web
    env: node
    plan: free
    buildCommand: ls -R && cd web && npm install && npm run build
    startCommand: cd web && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION # Force install devDependencies for build
        value: false
      - key: PORT
        value: 10000
      - key: API_URL
        value: http://api:10000/api/v1
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set this in Render dashboard after API service is live
        placeholder: "https://api.onrender.com/api/v1"

  # 4. Cron Job: Clear Cache (Optional - Run manually or periodically)
  - type: cron
    name: clear-cache-job
    env: node
    plan: free
    schedule: "0 0 * * *" # Runs daily at midnight. Can be disabled in dashboard.
    buildCommand: ls -R && cd api && npm install
    startCommand: cd api && npm run cache:clear
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: FRONTEND_URL
        value: http://web:10000 # Use internal service URL (no manual update needed)

  # 5. Worker Service (BullMQ Processor)
  # [OPTIMIZATION] Tách biệt xử lý ảnh và background jobs khỏi API chính
  - type: worker
    name: worker
    env: node
    plan: starter
    buildCommand: cd api && npm install && npm run build
    startCommand: cd api && node dist/main.js --type=worker # Would need logic to run only worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
