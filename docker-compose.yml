# =====================================================================
# DOCKER COMPOSE - FULLSTACK (API + WEB)
# =====================================================================
# Giải thích cho thực tập sinh:
# File này dùng để chạy toàn bộ môi trường phát triển cục bộ một cách nhanh chóng.
# Nó khởi tạo: Postgres (Database), Redis (Cache), API (Backend) và Web (Frontend).
#
# Cách dùng:
#   docker compose up -d --build
# =====================================================================

services:
  # 1. Database Service (PostgreSQL)
  postgres:
    image: ankane/pgvector:v0.4.1 # Supports Postgres 15
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_network
    restart: always

  # 2. Cache Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_network
    restart: always

  # 3. API Service (NestJS)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    # container_name: api # Removed for replicas to work
    ports:
      - "8080:8080"
    deploy:
      replicas: 2 # Scalable
    environment:
      DATABASE_URL: postgres://postgres:123456@postgres:5432/ecommerce?schema=public
      REDIS_URL: redis://redis:6379
      DATABASE_POOL_SIZE: 10
      PORT: 8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    command: /bin/sh -c "until pg_isready -h postgres -p 5432 -U postgres; do echo 'Waiting for postgres...'; sleep 2; done; npx prisma migrate deploy && node dist/src/main"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ecommerce_network
    restart: always

  # 5. Worker Service (BullMQ)
  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: node dist/src/main # In NestJS, usually same entry but different env or logic
    environment:
      DATABASE_URL: postgres://postgres:123456@postgres:5432/ecommerce?schema=public
      REDIS_URL: redis://redis:6379
      IS_WORKER: "true"
    depends_on:
      - postgres
      - redis
    networks:
      - ecommerce_network
    restart: always

  # 4. Web Service (Next.js)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web
    ports:
      - "3000:3000"
    environment:
      # Client-side URL (browser -> api)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      # Server-side URL (web container -> api container qua network)
      API_URL: http://api:8080/api/v1
    depends_on:
      api:
        condition: service_started
    networks:
      - ecommerce_network
    restart: always

volumes:
  postgres_data:
  redis_data:

networks:
  ecommerce_network:
    driver: bridge
